<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tampilan PDF</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe src="dokumen.pdf#toolbar=0" type="application/pdf" title="Tampilan PDF">
        <p>Browser Anda tidak mendukung tampilan PDF. Silakan <a href="dokumen.pdf">download PDF di sini</a>.</p>
    </iframe>

</body>
</html>
